<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
<title>2048</title>
<!--
  진짜 게임 미니앱 — **권한 0개**로 돈다.

  지출 데이터를 전혀 보지 않고 자기 점수만 저장한다(`state.*`는 권한이 필요 없다).
  권한 모델을 이렇게 쓰라고 만든 것이다: 순수 게임은 아무것도 못 보게 두고,
  데이터가 필요한 게임만 선언하게 한다.

  조작·실패·재도전이 있다 — 앞서 만든 화면들에 없던 것이고, 그래서 그것들은
  게임이 아니라 정보였다.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf8ef; --grid: #bbada0; --cell: #cdc1b4; --text: #776e65;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --grid: #3f3a36; --cell: #2b2724; --text: #e7e5e4; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
    background: transparent; color: var(--text);
    /* 게임판에서 스크롤·당겨서새로고침이 일어나면 스와이프가 조작이 아니라
       화면 이동이 된다. */
    touch-action: none; user-select: none;
  }
  .bar { display: flex; gap: 8px; width: 100%; max-width: 340px; align-items: stretch; }
  .box {
    flex: 1; text-align: center; padding: 7px 10px; border-radius: 8px;
    background: var(--grid); color: #fff;
  }
  .box .k { font-size: 10px; opacity: .8; letter-spacing: .04em; }
  .box .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .btn {
    padding: 0 14px; font-size: 13px; font-weight: 700; color: #fff;
    background: #8f7a66; border: 0; border-radius: 8px; cursor: pointer;
  }
  #board {
    position: relative; width: 100%; max-width: 340px; aspect-ratio: 1;
    background: var(--grid); border-radius: 10px; padding: 8px;
  }
  .cellbg, .tile {
    position: absolute; width: calc((100% - 16px - 24px) / 4); aspect-ratio: 1;
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .cellbg { background: var(--cell); }
  .tile {
    transition: transform .1s ease-in-out;
    font-size: 26px; color: #776e65; background: #eee4da;
  }
  .tile[data-v="4"]    { background: #ede0c8; }
  .tile[data-v="8"]    { background: #f2b179; color: #f9f6f2; }
  .tile[data-v="16"]   { background: #f59563; color: #f9f6f2; }
  .tile[data-v="32"]   { background: #f67c5f; color: #f9f6f2; }
  .tile[data-v="64"]   { background: #f65e3b; color: #f9f6f2; }
  .tile[data-v="128"]  { background: #edcf72; color: #f9f6f2; font-size: 22px; }
  .tile[data-v="256"]  { background: #edcc61; color: #f9f6f2; font-size: 22px; }
  .tile[data-v="512"]  { background: #edc850; color: #f9f6f2; font-size: 22px; }
  .tile[data-v="1024"] { background: #edc53f; color: #f9f6f2; font-size: 17px; }
  .tile[data-v="2048"] { background: #edc22e; color: #f9f6f2; font-size: 17px; }
  .over {
    position: absolute; inset: 0; border-radius: 10px;
    background: rgba(238,228,218,.78); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    font-size: 22px; font-weight: 800; color: #776e65;
  }
  @media (prefers-color-scheme: dark) { .over { background: rgba(28,25,23,.82); color: #e7e5e4; } }
  .hint { font-size: 12px; opacity: .6; margin: 0; }
</style>
</head>
<body>
  <div class="bar">
    <div class="box"><div class="k">점수</div><div class="v" id="score">0</div></div>
    <div class="box"><div class="k">최고</div><div class="v" id="best">0</div></div>
    <button class="btn" id="new">새 게임</button>
  </div>
  <div id="board"></div>
  <p class="hint">스와이프하거나 방향키로 움직여요</p>

<script>
(() => {
  "use strict";

  /* ---------------------------------------------------------------------- *
   * 브릿지 — packages/shared/src/miniapp-bridge.ts와 같은 계약.
   * 이 게임은 `state.*`만 쓴다(권한 불필요).
   * ---------------------------------------------------------------------- */
  const BRIDGE_VERSION = 1;
  function invoke(method, params = {}) {
    return new Promise((resolve, reject) => {
      const requestId = `r${Date.now()}${Math.random().toString(36).slice(2)}`;
      let done = false;
      const finish = (fn) => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        window.removeEventListener("message", onMessage);
        fn();
      };
      const onMessage = (e) => {
        const d = e.data;
        if (!d || d.kind !== "response" || d.requestId !== requestId) return;
        finish(() => (d.ok ? resolve(d.data) : reject(new Error(d.error?.code ?? "host_error"))));
      };
      const timer = setTimeout(() => finish(() => reject(new Error("timeout"))), 8000);
      window.addEventListener("message", onMessage);
      window.parent.postMessage(
        { v: BRIDGE_VERSION, kind: "request", requestId, method, params }, "*");
    });
  }

  /* ---------------------------------------------------------------------- *
   * 게임 로직 — 순수 함수로 둔다. 렌더와 섞이면 "왜 안 합쳐지지"를 디버깅할 수 없다.
   * ---------------------------------------------------------------------- */
  const SIZE = 4;
  const STATE_KEY = "progress";

  /** 한 줄을 왼쪽으로 밀어 합친다. 합쳐진 칸은 그 판에서 다시 합쳐지지 않는다. */
  function slideRow(row) {
    const nums = row.filter((v) => v !== 0);
    const out = [];
    let gained = 0;
    for (let i = 0; i < nums.length; i += 1) {
      if (nums[i] === nums[i + 1]) {
        const merged = nums[i] * 2;
        out.push(merged);
        gained += merged;
        i += 1; // 다음 칸은 이미 합쳐졌다
      } else {
        out.push(nums[i]);
      }
    }
    while (out.length < SIZE) out.push(0);
    return { row: out, gained };
  }

  const rotate = (g) =>
    g[0].map((_, c) => g.map((r) => r[c]).reverse()); // 시계 90°

  function move(grid, dir) {
    // 전부 왼쪽 밀기로 환원한다 — 방향마다 따로 구현하면 한 방향만 틀린 버그가 난다.
    let g = grid.map((r) => r.slice());
    const turns = { left: 0, up: 3, right: 2, down: 1 }[dir];
    for (let i = 0; i < turns; i += 1) g = rotate(g);
    let gained = 0;
    const next = g.map((r) => {
      const res = slideRow(r);
      gained += res.gained;
      return res.row;
    });
    let out = next;
    for (let i = 0; i < (4 - turns) % 4; i += 1) out = rotate(out);
    const moved = JSON.stringify(out) !== JSON.stringify(grid);
    return { grid: out, gained, moved };
  }

  function spawn(grid) {
    const empty = [];
    for (let r = 0; r < SIZE; r += 1)
      for (let c = 0; c < SIZE; c += 1) if (grid[r][c] === 0) empty.push([r, c]);
    if (empty.length === 0) return grid;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    const g = grid.map((row) => row.slice());
    g[r][c] = Math.random() < 0.9 ? 2 : 4;
    return g;
  }

  function canMove(grid) {
    return ["left", "right", "up", "down"].some((d) => move(grid, d).moved);
  }

  /* ---------------------------------------------------------------------- *
   * 상태와 렌더
   * ---------------------------------------------------------------------- */
  let grid = [];
  let score = 0;
  let best = 0;
  let over = false;

  const board = document.getElementById("board");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");

  // 배경 칸은 한 번만 그린다.
  for (let r = 0; r < SIZE; r += 1) {
    for (let c = 0; c < SIZE; c += 1) {
      const el = document.createElement("div");
      el.className = "cellbg";
      el.style.transform = pos(r, c);
      board.appendChild(el);
    }
  }

  function pos(r, c) {
    // 8px 패딩 + 8px 간격. 퍼센트로 두면 부모 크기가 바뀌어도 따라간다.
    return `translate(calc(${c} * (100% + 8px)), calc(${r} * (100% + 8px)))`;
  }

  function render() {
    board.querySelectorAll(".tile, .over").forEach((n) => n.remove());
    for (let r = 0; r < SIZE; r += 1) {
      for (let c = 0; c < SIZE; c += 1) {
        const v = grid[r][c];
        if (v === 0) continue;
        const el = document.createElement("div");
        el.className = "tile";
        el.dataset.v = String(v);
        el.textContent = String(v);
        el.style.transform = pos(r, c);
        board.appendChild(el);
      }
    }
    scoreEl.textContent = score.toLocaleString("ko-KR");
    bestEl.textContent = best.toLocaleString("ko-KR");

    if (over) {
      const veil = document.createElement("div");
      veil.className = "over";
      veil.innerHTML = `<div>더 못 움직여요</div>`;
      const again = document.createElement("button");
      again.className = "btn";
      again.style.padding = "10px 18px";
      again.textContent = "다시 하기";
      again.onclick = start;
      veil.appendChild(again);
      board.appendChild(veil);
    }
  }

  /** 진행 상황을 호스트에 저장한다 — 앱을 껐다 켜도 이어진다. */
  function persist() {
    invoke("state.set", {
      key: STATE_KEY,
      state: { grid, score, best, over },
    }).catch(() => {
      // 저장 실패는 게임을 멈출 이유가 아니다. 다음 수에서 다시 저장된다.
    });
  }

  function handle(dir) {
    if (over) return;
    const res = move(grid, dir);
    if (!res.moved) return;
    grid = spawn(res.grid);
    score += res.gained;
    if (score > best) best = score;
    if (!canMove(grid)) over = true;
    render();
    persist();
  }

  function start() {
    grid = spawn(spawn(Array.from({ length: SIZE }, () => Array(SIZE).fill(0))));
    score = 0;
    over = false;
    render();
    persist();
  }

  /* ---------------------------------------------------------------------- *
   * 입력
   * ---------------------------------------------------------------------- */
  document.getElementById("new").onclick = start;

  window.addEventListener("keydown", (e) => {
    const dir = {
      ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
    }[e.key];
    if (!dir) return;
    e.preventDefault();
    handle(dir);
  });

  let touch = null;
  board.addEventListener("touchstart", (e) => {
    touch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  board.addEventListener("touchend", (e) => {
    if (!touch) return;
    const dx = e.changedTouches[0].clientX - touch.x;
    const dy = e.changedTouches[0].clientY - touch.y;
    touch = null;
    // 24px 미만은 탭으로 본다 — 손가락은 완전히 정지하지 않으므로 문턱이 없으면
    // 탭만 해도 판이 움직인다.
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    handle(
      Math.abs(dx) > Math.abs(dy)
        ? dx > 0 ? "right" : "left"
        : dy > 0 ? "down" : "up",
    );
  }, { passive: true });

  /* ---------------------------------------------------------------------- *
   * 부팅 — 저장된 판이 있으면 이어서 한다
   * ---------------------------------------------------------------------- */
  (async () => {
    try {
      const saved = await invoke("state.get", { key: STATE_KEY });
      const s = saved?.state;
      // 저장된 값의 모양을 믿지 않는다 — 예전 버전이 남아 있을 수 있고, 그때
      // 화면이 깨지면 사용자는 게임을 다시 시작할 방법조차 잃는다.
      const ok =
        s && Array.isArray(s.grid) && s.grid.length === SIZE &&
        s.grid.every((r) => Array.isArray(r) && r.length === SIZE) &&
        typeof s.score === "number" && typeof s.best === "number";
      if (ok) {
        grid = s.grid;
        score = s.score;
        best = s.best;
        over = Boolean(s.over);
        render();
        return;
      }
    } catch {
      // 호스트가 없거나 실패해도 게임은 돌아야 한다. 점수만 안 남는다.
    }
    start();
  })();
})();
</script>
</body>
</html>
