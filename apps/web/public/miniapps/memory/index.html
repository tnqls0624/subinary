<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
<title>기억력 카드</title>
<!--
  기억력 카드 — 권한 0개. 지출을 보지 않고 최소 시도 기록만 저장한다.

  브릿지는 `../bridge.js`가 `window.MiniApp`으로 제공한다.

  ## 이 게임의 기록은 "적을수록 좋다"

  2048·스네이크는 점수가 클수록 좋지만 여기는 **시도 횟수가 적을수록** 좋다.
  최고 기록 비교 방향이 반대라, 그 판단을 한곳(`isBetter`)에 모아 둔다.
-->
<style>
  :root { color-scheme: light dark; --card: #6366f1; --back: #e0e7ff; --fg: #1e1b4b; }
  @media (prefers-color-scheme: dark) { :root { --back: #312e81; --fg: #e0e7ff; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
    background: transparent; user-select: none;
  }
  .bar { display: flex; gap: 8px; width: 100%; max-width: 340px; }
  .box {
    flex: 1; text-align: center; padding: 7px 10px; border-radius: 8px;
    background: var(--card); color: #fff;
  }
  .box .k { font-size: 10px; opacity: .8; letter-spacing: .04em; }
  .box .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .btn {
    padding: 0 14px; font-size: 13px; font-weight: 700;
    color: #fff; background: #4f46e5; border: 0; border-radius: 8px; cursor: pointer;
  }
  #grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    width: 100%; max-width: 340px;
  }
  .card {
    aspect-ratio: 1; border: 0; padding: 0; border-radius: 10px;
    background: var(--card); color: transparent;
    font-size: 28px; cursor: pointer;
    transition: background .18s ease, transform .12s ease, color .1s ease;
  }
  .card:active:not(:disabled) { transform: scale(.96); }
  .card.up   { background: var(--back); color: var(--fg); }
  .card.done { background: var(--back); color: var(--fg); opacity: .45; cursor: default; }
  .msg { font-size: 13px; opacity: .7; margin: 0; min-height: 18px; text-align: center; }
</style>
</head>
<body>
  <div class="bar">
    <div class="box"><div class="k">시도</div><div class="v" id="tries">0</div></div>
    <div class="box"><div class="k">최소 기록</div><div class="v" id="best">—</div></div>
    <button class="btn" id="new">새 게임</button>
  </div>
  <div id="grid"></div>
  <p class="msg" id="msg">같은 그림 두 장을 찾아요</p>

<script src="../bridge.js"></script>
<script>
(() => {
  "use strict";
  const { state } = window.MiniApp;

  const FACES = ["🍎", "🍊", "🍇", "🍑", "🥝", "🍋", "🍓", "🫐"]; // 8쌍 = 16장
  const STATE_KEY = "best";
  const PEEK_MS = 700; // 안 맞은 두 장을 다시 덮기까지

  const gridEl = document.getElementById("grid");
  const triesEl = document.getElementById("tries");
  const bestEl = document.getElementById("best");
  const msgEl = document.getElementById("msg");

  let deck = [];      // { face, done }
  let open = [];      // 뒤집힌 카드 인덱스
  let tries = 0;
  let best = null;    // 최소 시도. null이면 기록 없음
  let locked = false; // 두 장이 열린 동안 입력 차단

  /** 이 게임은 **적을수록** 좋다. 방향 판단을 한곳에 모은다. */
  const isBetter = (next, prev) => prev === null || next < prev;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function render() {
    gridEl.innerHTML = "";
    deck.forEach((card, i) => {
      const el = document.createElement("button");
      const isUp = open.includes(i);
      el.className = "card" + (card.done ? " done" : isUp ? " up" : "");
      el.textContent = card.face;
      el.disabled = card.done || isUp || locked;
      el.setAttribute(
        "aria-label",
        card.done ? `맞춘 카드 ${card.face}` : isUp ? `열린 카드 ${card.face}` : "덮인 카드",
      );
      el.onclick = () => flip(i);
      gridEl.appendChild(el);
    });
    triesEl.textContent = String(tries);
    bestEl.textContent = best === null ? "—" : String(best);
  }

  function flip(i) {
    if (locked || open.includes(i) || deck[i].done) return;
    open.push(i);

    if (open.length < 2) {
      render();
      return;
    }

    tries += 1;
    const [a, b] = open;
    const matched = deck[a].face === deck[b].face;

    if (matched) {
      deck[a].done = true;
      deck[b].done = true;
      open = [];
      render();
      if (deck.every((c) => c.done)) finish();
      return;
    }

    // 안 맞았으면 잠깐 보여준 뒤 덮는다. 그 사이 입력을 막지 않으면 세 장째가 열린다.
    locked = true;
    render();
    setTimeout(() => {
      open = [];
      locked = false;
      render();
    }, PEEK_MS);
  }

  function finish() {
    if (isBetter(tries, best)) {
      best = tries;
      state.set(STATE_KEY, { best });
      msgEl.textContent = `${tries}번 만에 끝냈어요 · 최소 기록이에요`;
    } else {
      msgEl.textContent = `${tries}번 만에 끝냈어요`;
    }
    render();
  }

  function reset() {
    deck = shuffle([...FACES, ...FACES]).map((face) => ({ face, done: false }));
    open = [];
    tries = 0;
    locked = false;
    msgEl.textContent = "같은 그림 두 장을 찾아요";
    render();
  }

  document.getElementById("new").onclick = reset;

  (async () => {
    const saved = await state.get(STATE_KEY);
    // 저장된 값의 모양을 믿지 않는다 — 깨졌으면 "기록 없음"으로 시작한다.
    if (saved && typeof saved.best === "number" && saved.best > 0) best = saved.best;
    reset();
  })();
})();
</script>
</body>
</html>
