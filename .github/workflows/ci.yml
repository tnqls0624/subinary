name: CI

# 운영 secret·endpoint 없이 도는 PR/푸시 검증(ADR-0022가 기각한 것은 'GitHub Actions를 호스트다운
# 경보 monitor로 쓰는 것'이지 빌드/타입체크 CI가 아니다). docker/DB 없이 되는 것만 실행한다.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR·main 푸시마다 시크릿 유출 검사. --redact 로 로그에 원문을 남기지 않는다.
  # 테스트 픽스처 오탐은 루트 .gitleaksignore fingerprint 로 제외한다.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # --no-git: 현재 트리만 검사. 이력에 남은 과거 유출은 회전으로 대응하고
      # force-push/이력 재작성은 하지 않는다(PR 본문·운영 체크리스트 참고).
      - name: Scan for secrets
        run: gitleaks detect --source . --no-git --verbose --redact

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Android 네이티브 빌드가 이 job에 붙으면 시크릿으로 파일을 풀어 쓴다.
      # 시크릿 미등록(빈 값)이면 스킵. 로컬·전용 모바일 CI도 동일 스크립트 사용:
      #   apps/mobile/scripts/write-google-services.sh
      # ⚠️ 빈 값 검사는 셸에서 한다. step `if:`에서는 secrets 컨텍스트를 쓸 수 없고, 쓰면
      # 워크플로 파일 전체가 무효가 돼 job이 하나도 돌지 않은 채 실패한다(5439284에서 실제로 났다).
      - name: Materialize google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON 시크릿이 없어 건너뜁니다."
            exit 0
          fi
          sh apps/mobile/scripts/write-google-services.sh

      # packageManager 필드(pnpm@9.15.4)에서 버전 자동 감지
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 타입 안전성(모노레포 전역). 운영 런타임 env가 필요 없다.
      - name: Typecheck
        run: pnpm typecheck

      # 공유 패키지 빌드(contracts/config/shared/database 등). web 앱 빌드는 NEXT_PUBLIC_* 빌드
      # 인자가 필요해 CI에서 제외 — 여기선 env 비의존 패키지만 빌드한다.
      - name: Build packages
        run: pnpm build:packages

      # 순수 패키지 vitest 스위트(card-parsers/shared/rag/ai-providers/slack-parser).
      # `turbo run test`가 test 스크립트를 가진 workspace만 실행한다 — DB/외부 서비스 불요.
      # 이게 없던 동안 200여 개 단위 테스트가 CI에서 한 번도 돌지 않았다.
      - name: Package unit tests
        run: pnpm test

      # docker/DB/외부 서비스가 필요 없는 단위·검증 테스트만.
      - name: Unit & verification tests
        run: |
          node --test infrastructure/ops-sentinel/ops-sentinel.verify.mjs
          node --test scripts/ops/auto-investigate.verify.mjs
          node --test scripts/lib/verification-database-guard.test.mjs
          node --test scripts/lib/dockerfile-workspaces.test.mjs
          node --test packages/contracts/test/*.test.mjs
          node --test tools/shinhan-loan-collector/test/*.test.mjs
          node --test tools/bank-web-runner/test/*.test.mjs
          node --test tools/sujain-web-runner/test/*.test.mjs
          node --test scripts/lib/sujain-web-runtime.test.mjs
          pnpm test:auth-validation
          pnpm test:config-validation
