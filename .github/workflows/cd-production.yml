name: CD Production

# main 에서 CI(이름: CI)가 성공으로 끝난 뒤에만 운영 Docker 배포를 시도한다.
# GitHub-hosted runner 는 홈 Mac Docker 에 닿지 않으므로 실제 deploy 는
# self-hosted runner(라벨: self-hosted, macOS, production-docker)에서만 실행한다.
#
# 첫 자동 배포 조건(둘 다 필요):
#   1. 이 워크플로가 main 에 머지됨
#   2. 홈 Mac runner + 아래 repository variables 가 준비됨
# 준비가 안 됐으면 gate 가 실패한다(성공으로 조용히 건너뛰지 않음).
#
# 범위: scripts/ops/deploy.sh 의 Docker 경로만(마이그레이션 포함).
# OTA/Capgo/네이티브 재빌드는 DEPLOY_SKIP_OTA=true 로 제외한다.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  # 운영 동시 배포 금지(docs/operations/README.md). 진행 중 배포를 취소하지 않는다.
  group: production-docker-deploy
  cancel-in-progress: false

jobs:
  # ubuntu-latest 게이트: CI 성공·push·활성화 플래그만 검사한다.
  # runner 가 없어도 이 job 은 돌고, 미설정이면 빨간 실패로 남긴다.
  gate:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    outputs:
      deploy_sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Refuse deploy until production CD is explicitly enabled
        env:
          PRODUCTION_CD_ENABLED: ${{ vars.PRODUCTION_CD_ENABLED }}
          PRODUCTION_ENV_DIR: ${{ vars.PRODUCTION_ENV_DIR }}
        run: |
          set -eu
          echo "CI run: ${{ github.event.workflow_run.html_url }}"
          echo "Deploy SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "CI event: ${{ github.event.workflow_run.event }}"
          echo "CI head branch: ${{ github.event.workflow_run.head_branch }}"

          missing=0
          if [ "${PRODUCTION_CD_ENABLED}" != "true" ]; then
            echo "::error::Repository variable PRODUCTION_CD_ENABLED must be exactly 'true' before auto-deploy runs."
            echo "Register the home-Mac self-hosted runner (labels: self-hosted, macOS, production-docker), confirm it is Idle, then set PRODUCTION_CD_ENABLED=true."
            echo "See docs/operations/cd-production.md."
            missing=1
          fi
          if [ -z "${PRODUCTION_ENV_DIR}" ]; then
            echo "::error::Repository variable PRODUCTION_ENV_DIR is empty."
            echo "Set it to the absolute path on the home Mac that already holds .env and .env.production (path only — never put secret values in GitHub)."
            echo "See docs/operations/cd-production.md."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Gate passed: PRODUCTION_CD_ENABLED=true, PRODUCTION_ENV_DIR is set."

  deploy:
    needs: gate
    runs-on: [self-hosted, macOS, production-docker]
    timeout-minutes: 120
    steps:
      # workflow_run 의 GITHUB_SHA 는 default branch tip 이라 CI 가 검증한 커밋과
      # 다를 수 있다. 반드시 workflow_run.head_sha 를 체크아웃한다.
      - name: Checkout the CI-verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Link production env files from Mac-local directory
        env:
          PRODUCTION_ENV_DIR: ${{ vars.PRODUCTION_ENV_DIR }}
        run: |
          set -eu
          if [ ! -d "$PRODUCTION_ENV_DIR" ]; then
            echo "::error::PRODUCTION_ENV_DIR does not exist on this runner: $PRODUCTION_ENV_DIR"
            exit 1
          fi
          if [ ! -f "$PRODUCTION_ENV_DIR/.env" ]; then
            echo "::error::Missing $PRODUCTION_ENV_DIR/.env (gitignored; must already exist on the Mac)."
            exit 1
          fi
          if [ ! -f "$PRODUCTION_ENV_DIR/.env.production" ]; then
            echo "::error::Missing $PRODUCTION_ENV_DIR/.env.production (gitignored; must already exist on the Mac)."
            exit 1
          fi
          ln -sfn "$PRODUCTION_ENV_DIR/.env" .env
          ln -sfn "$PRODUCTION_ENV_DIR/.env.production" .env.production
          echo "Linked .env and .env.production from PRODUCTION_ENV_DIR."

      - name: Verify Docker is reachable on the home Mac
        run: |
          set -eu
          command -v docker >/dev/null
          docker info >/dev/null
          echo "Docker daemon is available."

      # 기존 운영 경로. bootstrap → compose up → migrate → verify.
      # OTA 는 이 CD 범위 밖이므로 반드시 건너뛴다.
      - name: Deploy production Docker stack
        env:
          DEPLOY_SKIP_OTA: "true"
        run: sh scripts/ops/deploy.sh
