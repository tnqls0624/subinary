<!doctype html><html lang="ko"><meta charset="utf-8"><title>뒷마당 sandbox 검증</title>
<style>body{font-family:system-ui;background:#fff}iframe{display:block;border:1px solid #999;height:470px;width:320px}button{padding:10px;margin:4px}pre{white-space:pre-wrap}</style>
<h1>뒷마당 sandbox 검증</h1><button onclick="width(320)">320px</button><button onclick="width(360)">360px</button><button onclick="width(430)">430px</button><button onclick="reopen()">닫고 다시 열기</button>
<button onclick="control('reset')">초기화</button><button onclick="control('get-fail')">GET 실패</button><button onclick="control('put-fail')">PUT 실패</button><button onclick="control('put-timeout')">PUT 10초 지연</button><button onclick="control('normal')">정상 복구</button>
<div id="mount"></div><pre id="log"></pre><script src="host.js"></script><script>
let runtime,frame; const log=document.getElementById('log');
async function request(method,path,body){const response=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});if(!response.ok)throw Error('HTTP '+response.status);return response.json();}
const store={list:()=>request('GET','/state'),save:(_h,_a,_k,state)=>request('PUT','/state',state),remove:async()=>{throw Error('검증 범위 밖')}};
function reopen(){runtime?.destroy();frame?.remove();frame=document.createElement('iframe');frame.sandbox='allow-scripts';frame.title='뒷마당';const handlers=BackyardHost.createMiniappStateHandlers('test-household','backyard',[],store);runtime=BackyardHost.createMiniappHostRuntime({appKey:'backyard',permissions:[],getFrame:()=>frame.contentWindow,getHandlers:()=>handlers});frame.onload=()=>runtime.loaded();frame.src='/miniapps/backyard/index.html';document.getElementById('mount').append(frame);}
function width(value){frame.style.width=value+'px'}
async function control(mode){await request('POST','/control',{mode});if(mode==='reset'||mode==='get-fail')reopen();}
window.addEventListener('message',event=>void runtime.receive(event));setInterval(async()=>{log.textContent=JSON.stringify(await request('GET','/evidence'),null,2)},500);reopen();
</script></html>
