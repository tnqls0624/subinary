<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>뒷마당 그래픽 미리보기</title><link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e7ead0}
  #host{position:fixed;inset:0}
  #host canvas{display:block;width:100%;height:100%}
</style>
<!--
  실제 배포 스크립트만 로드한다. 미리보기 전용 장면을 따로 만들면 화면을 고쳐도
  제품이 안 바뀌는 검증 함정이 생긴다(슬라이스 4의 loadEngine 누락과 같은 종류).
-->
<script src="/miniapps/vendor/three-r128.min.js"></script>
<script src="/miniapps/backyard/balance.js"></script>
<script src="/miniapps/backyard/rules.js"></script>
<script src="/miniapps/backyard/codec.js"></script>
<script src="/miniapps/backyard/rpg-rules.js"></script>
<script src="/miniapps/backyard/rpg-codec.js"></script>
<script src="/miniapps/backyard/rpg3d-terrain.js"></script>
<script src="/miniapps/backyard/rpg3d-controller.js"></script>
<script src="/miniapps/backyard/rpg3d-models.js"></script>
<script src="/miniapps/backyard/rpg3d-world.js"></script>
<script src="/miniapps/backyard/rpg3d-scene.js"></script>
</head><body>
<div id="host"></div>
<script>
(() => {
  const host=document.getElementById('host');
  const canvas=document.createElement('canvas');host.append(canvas);
  /** 미리보기는 저장하지 않는다. commit은 메모리 사본만 갱신한다. */
  const data=BackyardRpgCodec.initial();
  // 가구 몇 개와 표본 기록을 넣어 빈 마당이 아닌 상태를 본다.
  data.rpg_world.items=['0:p:9:17','1:w:11:17','2:c:10:19','3:p:12:15'];
  data.rpg_collection.species=['s0:3:1757049600:node-0','s4:1:1757049600:node-8','s8:2:1757049600:fish-1'];
  let failure='';
  const hour=Number(new URLSearchParams(location.search).get('hour'));
  const stage=BackyardRpg3dScene.create(host,canvas,{walking:true,outfit:0,hour:Number.isFinite(hour)&&location.search.includes('hour=')?hour:12.5,onError:e=>{failure=String(e&&e.message||e);}});
  if(!stage){document.title='FAIL '+failure;window.__previewError=failure;return;}
  const world=BackyardRpg3dWorld.create({
    now:()=>1757049600,random:()=>0.42,
    commit:(key,value)=>{data[key]=value;return true;},
    locked:()=>false,suspended:()=>false,
  });
  world.sync(data,true);
  let walker=BackyardRpg3dController.create(BackyardRpgRules.fixture(),undefined);
  let time=0,extra=0;
  /** 한 프레임을 제품과 같은 순서로 진행한다. */
  function step(deltaMs){
    time+=deltaMs;
    walker.frame(time);
    const state=walker.state();
    const snapshot=world.frame(deltaMs,state,state.direction);
    stage.update(state.world,state.direction,deltaMs,false,{
      distance:state.distance+extra,moving:window.__moving===true,
      sitting:snapshot.actors.some(a=>a.sitting),reaching:false});
    stage.content(snapshot,deltaMs);
    stage.render();
    return snapshot;
  }
  /** 정해진 시간만큼 16.67ms 프레임으로 흘린다. @param {number} ms */
  window.__advance=(ms)=>{let last=null;for(let t=0;t<ms;t+=16.67)last=step(16.67);return last;};
  /** 논리 좌표로 순간이동한다. 저장 형식을 거치지 않는다. */
  window.__place=(x,y,direction)=>{walker=BackyardRpg3dController.create({x,y},direction);time=0;};
  /** 걷는 포즈를 만들기 위해 위상만 밀어 준다. */
  window.__pose=(distance,moving)=>{extra=distance;window.__moving=moving!==false;};
  window.__input=(x,y)=>walker.input({x,y});
  window.__hour=(h)=>stage.setHour(h);
  window.__ready=()=>host.dataset.ready==='true';
  window.__stage=stage;window.__world=world;window.__data=data;
  window.__advance(500);
})();
</script>
</body></html>
